schema_version: "1.1"
name: postgres-long-transaction
expected_outcome: |
  Первая фраза отвечает: транзакция удерживает горизонт видимости, и VACUUM не может удалять мёртвые версии строк. Дальше причина через MVCC, последствия (раздувание таблиц и индексов, замедление чтения), способ найти и ограничить такие транзакции. Цепочка причин изложена прозой.
